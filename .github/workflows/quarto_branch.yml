on:
  push:
    branches-ignore:
      - gh-pages
      - main

name: quarto

jobs:
  check-src:
    runs-on: ubuntu-latest
    name: "Build document"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_FOLDER: "source"
    permissions:
      contents: read
    steps:
      - uses: inbo/actions/render_quarto@55098124f283c4f9b9402d43ec4a9382ee05c105 # devel
